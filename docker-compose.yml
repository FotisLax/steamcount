services:
  db:
    image: postgres:16
    command: postgres -c shared_buffers=64MB -c max_connections=30 -c work_mem=4MB -c maintenance_work_mem=32MB
    restart: unless-stopped
    environment:
      POSTGRES_DB: steamcount
      POSTGRES_USER: steam
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steam -d steamcount"]
      interval: 5s
      timeout: 5s
      retries: 10

  poller:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: steamcount
      DB_USER: steam
      DB_PASSWORD: ${DB_PASSWORD}
      STEAM_API_KEY: ${STEAM_API_KEY}

  api:
    build: .
    restart: unless-stopped
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: steamcount
      DB_USER: steam
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:8000:8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config: